name: refresh stats

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Draw the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          cd ${{ github.workspace }}
          python3 scripts/generate_stats.py

      - name: Validate generated SVG XML
        run: |
          cd ${{ github.workspace }}
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ("stats.svg", "streak.svg", "langs.svg", "year.svg"):
              ET.parse(path)
              print(f"OK {path}")
          PY

      - name: Commit whatever changed
        run: |
          cd ${{ github.workspace }}
          FILES="stats.svg streak.svg langs.svg year.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
